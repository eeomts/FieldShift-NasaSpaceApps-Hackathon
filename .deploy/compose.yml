# Suba sempre pelo ./.deploy/agroai: ele le o .deploy/env/<ambiente>.env e preenche estas variaveis.

services:

  web:
    # os dois sites (web e web-demo) no mesmo Caddy, com a mesma API e o mesmo banco
    build:
      context: ../agroai
      dockerfile: ../.deploy/web.Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      AGROAI_SITE: ${AGROAI_SITE:?suba pelo ./.deploy/agroai}
      AGROAI_SITE_DEMO: ${AGROAI_SITE_DEMO:?suba pelo ./.deploy/agroai}
    ports:
      - "${AGROAI_PORTA_HTTP:?suba pelo ./.deploy/agroai}:80"
      - "${AGROAI_PORTA_HTTPS:-443}:443"
      - "${AGROAI_PORTA_HTTPS:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
      - caddy-config:/config

  api:
    build:
      context: ..
      dockerfile: .deploy/api.Dockerfile
      additional_contexts:
        deploy: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      DB_HOST: ${DB_HOST:?suba pelo ./.deploy/agroai}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?suba pelo ./.deploy/agroai}
      DB_USER: ${DB_USER:?suba pelo ./.deploy/agroai}
      DB_PASSWORD: ${DB_PASSWORD:?suba pelo ./.deploy/agroai}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      JWT_SECRET: ${JWT_SECRET:?suba pelo ./.deploy/agroai}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-10080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    profiles: ["banco"]
    build:
      context: .
      dockerfile: db.Dockerfile
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?suba pelo ./.deploy/agroai}
      POSTGRES_USER: ${DB_USER:?suba pelo ./.deploy/agroai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?suba pelo ./.deploy/agroai}
    ports:
      # so esta maquina enxerga (para DBeaver/psql); nunca 0.0.0.0
      - "127.0.0.1:${AGROAI_PORTA_BANCO:-5434}:5432"
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  banco:
  caddy:
  caddy-config:
