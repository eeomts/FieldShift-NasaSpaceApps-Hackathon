# Questionário do onboarding em formato que o código lê.
# Fontes: application/ONBOARDING.md (conteúdo) e o código já implementado (ids e valores):
#   agroia/api/app/onboarding/schemas.py  → nomes dos campos (id) e valores aceitos (opcoes.valor)
#   agroia/api/app/onboarding/perfil.py   → o que cada resposta alimenta (alimenta)
#   agroia/web/src/onboarding/Passos.tsx  → textos em português das telas
# Se mudar um id ou valor aqui, mude também no schemas.py (e vice-versa). Dono: Pessoa 3.
#
# tipos: sim_nao_nao_sei | escolha | figuras | texto_livre | multipla | mapa | calendario | ano
#
# Campos:
#   id           = nome do campo em Respostas (schemas.py)
#   bloco        1 a 6, como no ONBOARDING.md
#   texto        pt e en (ver "Idiomas" abaixo)
#   tipo         ver lista acima
#   opcoes       valor (igual ao schemas.py) + rótulo pt/en (+ imagem nas perguntas de figuras)
#   obrigatoria  só o local (q5_local) trava o avanço: sem ele não há dado global
#   mostrar_se   pergunta condicional: só aparece se outra resposta ou o local (q5_local) pedirem
#   por_item     a pergunta se repete em cada cultura encontrada na q8 (cartão por cultura)
#   alimenta     o que a resposta preenche (perfil.py e coluna "Para quê" do ONBOARDING.md)
#                fonte: produtor = "informado pelo produtor" (peso 0,5 na fusão de evidências)
#   interpretacao  só no texto livre: a IA separa e casa com a base; o produtor confirma
#
# "nao_sei" nunca vira valor: deixa o atributo vazio e marca baixa confiança.
#
# Idiomas e região:
#   - Os textos NÃO são tradução literal: cada idioma usa o jeito que o agricultor fala.
#   - pt: português do Brasil, tratamento "você".
#   - en: inglês simples de campo ("farm", "crop", "stubble"), sem termos técnicos.
#   - O idioma padrão vem do país do ponto (q5_local.pais); o produtor pode trocar.
#   - Algumas perguntas mudam conforme o local: unidade de área (q2), ordem das correções do
#     solo (q21) e quais perdas aparecem (q24). As regras estão em cada pergunta.
#
# ⚠️ Perguntas sobre culturas (q8 e q26a) estão em espera: serão revistas quando a Pessoa 1
#    terminar a nova base de culturas.

perguntas:

  # ───────────── Bloco 1: Quem é você ─────────────

  - id: q1_quem
    bloco: 1
    texto:
      pt: "Quem está respondendo?"
      en: "Who's filling this in?"
    tipo: escolha
    opcoes:
      - valor: produtor
        pt: "Eu sou o produtor"
        en: "I'm the farmer"
      - valor: tecnico
        pt: "Sou técnico ou estou ajudando um produtor"
        en: "I'm an extension agent, or I'm helping a farmer"
    obrigatoria: false
    alimenta:
      atributo: perfil
      se_tecnico: D              # perfil D e tela com mais detalhe técnico

  - id: q2_area
    bloco: 1
    texto:
      pt: "Mais ou menos, qual o tamanho da sua área?"
      en: "Roughly how big is your farm?"
    tipo: escolha
    # Os valores ficam sempre em hectares (é o que o motor usa). Só o rótulo muda de unidade.
    unidade:
      padrao: ha
      por_pais:
        acre: [US, GB, IN, PK, BD, MM, LR]   # países onde o agricultor costuma falar em acres
      pode_trocar: true                      # botão "ha / acre" ao lado da pergunta
    opcoes:
      - valor: "ate_2"
        ha:   { pt: "Até 2 ha",           en: "Up to 2 ha" }
        acre: { pt: "Até 5 acres",        en: "Up to 5 acres" }
      - valor: "2_20"
        ha:   { pt: "De 2 a 20 ha",       en: "2 to 20 ha" }
        acre: { pt: "De 5 a 50 acres",    en: "5 to 50 acres" }
      - valor: "20_200"
        ha:   { pt: "De 20 a 200 ha",     en: "20 to 200 ha" }
        acre: { pt: "De 50 a 500 acres",  en: "50 to 500 acres" }
      - valor: "200_1000"
        ha:   { pt: "De 200 a 1.000 ha",  en: "200 to 1,000 ha" }
        acre: { pt: "De 500 a 2.500 acres", en: "500 to 2,500 acres" }
      - valor: "mais_1000"
        ha:   { pt: "Mais de 1.000 ha",   en: "More than 1,000 ha" }
        acre: { pt: "Mais de 2.500 acres", en: "More than 2,500 acres" }
    # 1 ha ≈ 2,47 acres; as faixas em acre foram arredondadas para números fáceis.
    obrigatoria: false
    alimenta:
      atributo: escala           # tipo de recomendação

  - id: q3_tecnico
    bloco: 1
    texto:
      pt: "Algum técnico agrícola ou agrônomo costuma visitar a sua propriedade?"
      en: "Does an extension agent or agronomist ever visit your farm?"
    tipo: escolha
    opcoes:
      - { valor: sim,      pt: "Sim",      en: "Yes" }
      - { valor: as_vezes, pt: "Às vezes", en: "Sometimes" }
      - { valor: nao,      pt: "Não",      en: "No" }
    obrigatoria: false
    alimenta:
      atributo: assistencia_tecnica   # linguagem e próximo passo sugerido

  - id: q4_animais
    bloco: 1
    texto:
      pt: "Você cria animais?"
      en: "Do you keep any livestock?"
    tipo: escolha
    opcoes:
      - { valor: sim, pt: "Sim", en: "Yes" }
      - { valor: nao, pt: "Não", en: "No" }
    obrigatoria: false
    alimenta:
      modificador: animais       # valoriza culturas de forragem

  # ───────────── Bloco 2: O campo ─────────────

  - id: q5_local
    bloco: 2
    texto:
      pt: "Onde fica a sua propriedade?"
      en: "Where is your farm?"
    ajuda:
      pt: "Procure o nome da cidade ou da região, ou toque no mapa. É com esse ponto que buscamos os dados da NASA."
      en: "Search for your town or area, or tap the map. We use that spot to pull NASA data."
    tipo: mapa
    entrada:
      busca:                     # barra de pesquisa por nome (cidade, município, região, fazenda)
        placeholder:
          pt: "Ex.: Sorriso, Mato Grosso"
          en: "E.g.: Nakuru, Kenya"
        servico: geocodificacao  # sugestão: Nominatim/OpenStreetMap (ver nota abaixo)
        depois_da_busca: centralizar_mapa_e_pedir_toque   # o produtor ajusta o ponto exato no mapa
      toque_no_mapa: true
      gps: true
    obrigatoria: true
    # O produtor só informa o ponto. Os campos abaixo o app calcula sozinho a partir da coordenada.
    guarda:
      lat: { origem: ponto_do_mapa }
      lon: { origem: ponto_do_mapa }
      nome: { origem: busca_ou_digitado, opcional: true }
      pais:
        origem: calculado
        como: "ponto dentro do contorno do país (código ISO 3166-1 alfa-2, ex.: BR, KE, US)"
        fonte: "Natural Earth, Admin 0 Countries (domínio público)"
      zona_climatica:
        origem: calculado
        como: "classe Köppen-Geiger do pixel de 1 km (ex.: Aw, BSh, Cfa)"
        fonte: "Beck et al. (2023), mapas Köppen-Geiger 1 km, período 1991-2020 (CC BY 4.0)"
      hemisferio:
        origem: calculado
        como: "lat < 0 → sul; lat ≥ 0 → norte (inverte as estações do ano)"
    alimenta:
      atributo: localizacao      # chave para todos os dados globais (POWER, IMERG, SMAP, SoilGrids, SRTM...)
      usos:
        lat_lon: "busca dos dados da NASA e do SoilGrids/SRTM"
        pais: "idioma padrão, unidade de área (q2) e nomes locais das culturas"
        zona_climatica: "ordem das correções do solo (q21), quais perdas aparecem (q24) e, depois, culturas da q8"
        hemisferio: "estações do ano nos textos (estação chuvosa, inverno, verão)"
    # Nota sobre a busca: o servidor público do Nominatim tem limite de uso (cerca de 1 pedido por
    # segundo, identificação do app obrigatória, sem uso pesado). Para produção, usar instância própria
    # ou serviço pago. Política: https://operations.osmfoundation.org/policies/nominatim/

  - id: q6_irrigacao
    bloco: 2
    texto:
      pt: "Você irriga a lavoura?"
      en: "Do you irrigate?"
    tipo: escolha
    opcoes:
      - { valor: sim,   pt: "Sim",          en: "Yes" }
      - { valor: parte, pt: "Só uma parte", en: "Only part of the farm" }
      - { valor: nao,   pt: "Não",          en: "No" }
    obrigatoria: false
    alimenta:
      modificador: irrigacao     # balanço de água e culturas possíveis

  - id: q7_terreno
    bloco: 2
    texto:
      pt: "Como é o terreno?"
      en: "Is your land flat or sloping?"
    tipo: figuras                # no app: desenho de encosta com 3 inclinações
    opcoes:
      - { valor: plano,     pt: "Plano",                 en: "Flat" }
      - { valor: leve,      pt: "Um pouco inclinado",    en: "Gentle slope" }
      - { valor: inclinado, pt: "Bem inclinado (morro)", en: "Steep (hillside)" }
    obrigatoria: false
    alimenta:
      atributo: declividade
      fonte: produtor
      cruza_com: srtm            # compara com a declividade do SRTM (risco de erosão)

  # ───────────── Bloco 3: O que você planta ─────────────
  # ⚠️ EM ESPERA (q8 e cartões por cultura): revisar quando a Pessoa 1 terminar a base de culturas.

  - id: q8_texto
    bloco: 3
    texto:
      pt: "Conte do seu jeito o que você planta, e quando."
      en: "Tell us in your own words what you plant, and when."
    # O exemplo muda conforme a zona climática do ponto (q5_local.zona_climatica, grupo Köppen = 1ª letra,
    # ou 2 letras no caso de Aw/As). Os exemplos falam em estações, não em meses, para servir nos dois hemisférios.
    exemplo_por_zona:
      Af_Am:                     # tropical úmido (chove o ano todo ou quase)
        pt: "planto mandioca e milho juntos e tenho um pedaço de capim para o gado"
        en: "I grow cassava and corn together and have a patch of grass for the cattle"
      Aw_As:                     # tropical com estação seca (savana)
        pt: "planto milho e feijão juntos na estação chuvosa e, depois da colheita, o campo fica parado na seca"
        en: "I plant corn and beans together in the rainy season and leave the field idle in the dry season"
      B:                         # árido e semiárido
        pt: "planto sorgo e feijão-caupi quando chegam as chuvas; o resto do ano o campo fica parado"
        en: "I plant sorghum and cowpea when the rains come; the rest of the year the field is idle"
      C:                         # temperado / subtropical
        pt: "planto soja no verão e trigo no inverno"
        en: "I grow soybean in summer and wheat in winter"
      D:                         # continental, inverno muito frio
        pt: "planto trigo na primavera e colho no fim do verão; no inverno o campo fica parado"
        en: "I sow wheat in spring and harvest at the end of summer; in winter the field is idle"
      padrao:                    # zona desconhecida ou E (polar)
        pt: "planto milho na estação das chuvas e, depois da colheita, deixo o campo parado"
        en: "I plant corn in the rainy season and leave the field idle after harvest"
    tipo: texto_livre
    obrigatoria: false
    interpretacao:
      ia: true                   # a IA separa as culturas (passo 8b)
      catalogo: cultura          # casa com culturas.csv + cultura_sinonimos.csv
      saida: q8_culturas         # lista de ItemCalendario
      campos: [texto_original, cultura_id, inicio_mes, fim_mes, perene, consorcio_com]
      confirmar_item_a_item: true
      nao_encontrada: manter_nome_sem_parametros   # entra no calendário, não na comparação
      fallback_sem_ia: lista_da_base                # "Adicionar cultura pela lista"
      contexto_local:            # a localização molda as culturas, mas nunca bloqueia
        idioma_dos_nomes: q5_local.pais            # usa primeiro os sinônimos do idioma/país
        ordem_da_lista: q5_local.zona_climatica    # culturas que combinam com a zona aparecem primeiro
        cultura_fora_do_clima: marcar_para_confirmar   # ex.: trigo citado em zona Af → "confere?"
        # Para isso a base de culturas precisa de uma coluna com as zonas Köppen de cada cultura
        # (pedido para a Pessoa 1; o FAO ECOCROP traz a zona Köppen de cada espécie).
    alimenta:
      tabela: calendario_atual

  # Passo 8c: um cartão por cultura encontrada. Tudo abaixo vai para o item de q8_culturas.
  - id: q8_culturas.cultura_id
    bloco: 3
    por_item: q8_culturas
    texto:
      pt: "Você planta {cultura}?"
      en: "Do you grow {cultura}?"
    tipo: escolha
    opcoes:
      - { valor: confirmar, pt: "Sim",            en: "Yes" }
      - { valor: trocar,    pt: "Trocar cultura", en: "Change crop" }
      - { valor: remover,   pt: "Remover",        en: "Remove" }
    obrigatoria: false

  - id: q8_culturas.perene
    bloco: 3
    por_item: q8_culturas
    texto:
      pt: "Ocupa o campo o ano todo (perene)"
      en: "Takes up the field all year (perennial)"
    tipo: escolha                # caixa de marcar; já vem marcada se a base diz perene
    opcoes:
      - { valor: true,  pt: "Sim", en: "Yes" }
      - { valor: false, pt: "Não", en: "No" }
    obrigatoria: false

  - id: q8_culturas.meses
    bloco: 3
    por_item: q8_culturas
    mostrar_se: { campo: perene, valor: false }
    texto:
      pt: "De que mês a que mês?"
      en: "From which month to which month?"
    tipo: calendario             # régua de 12 meses, já preenchida com o palpite da IA
    obrigatoria: false
    alimenta:
      campos: [inicio_mes, fim_mes]

  - id: q8_culturas.consorcio_com
    bloco: 3
    por_item: q8_culturas
    mostrar_se: { campo: consorcio_com, nao_vazio: true }   # só se a IA detectou consórcio
    texto:
      pt: "É plantado junto com {outra_cultura}?"
      en: "Is it planted together with {outra_cultura}?"
    tipo: escolha
    opcoes:
      - { valor: sim, pt: "Sim", en: "Yes" }
      - { valor: nao, pt: "Não", en: "No" }     # "não" esvazia consorcio_com
    obrigatoria: false

  - id: q8_culturas.ocupa
    bloco: 3
    por_item: q8_culturas
    texto:
      pt: "Ocupa o campo todo ou uma parte?"
      en: "Does it take up the whole field or part of it?"
    tipo: escolha
    opcoes:
      - { valor: todo,  pt: "Campo todo", en: "Whole field" }
      - { valor: parte, pt: "Uma parte",  en: "Part of it" }
    obrigatoria: false

  # ⚠️ Fim do trecho em espera.

  - id: q9_meses_vazios
    bloco: 3
    mostrar_se: { calendario: tem_meses_sem_cobertura }   # só aparece se sobrar mês vazio no calendário
    texto:
      pt: "Nesses meses a terra fica sem nada plantado?"
      en: "Is the land left bare in these months?"
    nota: "Mostrada sobre o calendário completo do ano, com os meses vazios destacados."
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: meses_sem_cobertura
      fonte: produtor

  - id: q10_pos_colheita
    bloco: 3
    texto:
      pt: "E depois da colheita, o que acontece com a área?"
      en: "What happens to the field after harvest?"
    tipo: escolha
    opcoes:
      - { valor: parado,    pt: "Fica parada",                     en: "It's left fallow" }
      - { valor: pasto,     pt: "Vira pasto",                      en: "It's grazed" }
      - { valor: outra,     pt: "Planto outra coisa",              en: "I plant another crop" }
      - { valor: cobertura, pt: "Planto algo para cobrir a terra", en: "I sow a cover crop" }
    obrigatoria: false
    alimenta:
      atributo: meses_sem_cobertura   # e risco de erosão
      fonte: produtor

  - id: q11_palha
    bloco: 3
    texto:
      pt: "Você deixa a palha e os restos da colheita no campo?"
      en: "Do you leave the stubble and crop residue on the field?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: palhada          # cobertura do solo e matéria orgânica
      fonte: produtor

  # ───────────── Bloco 4: O que você sabe do seu solo ─────────────

  - id: q12_analise
    bloco: 4
    texto:
      pt: "Você já fez análise de solo em laboratório?"
      en: "Have you ever had your soil tested in a lab?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: nivel_dado_solo
      se_nao_ou_nao_sei: sugerir_analise_solo

  - id: q12_tem_resultado
    bloco: 4
    mostrar_se: { pergunta: q12_analise, valor: sim }
    texto:
      pt: "Ainda tem o resultado?"
      en: "Do you still have the results?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: perfil
      se_sim: C                  # q12_analise = sim e q12_tem_resultado = sim → perfil C (laudo)

  - id: q12_ano
    bloco: 4
    mostrar_se: { pergunta: q12_analise, valor: sim }
    texto:
      pt: "De que ano é?"
      en: "What year was it?"
    tipo: ano                    # últimos 20 anos ou "não lembro"
    obrigatoria: false
    alimenta:
      atributo: ano_laudo

  - id: q13_textura
    bloco: 4
    texto:
      pt: "A sua terra é mais arenosa, mais argilosa ou meio-termo?"
      en: "Is your soil sandy, clay, or somewhere in between?"
    tipo: escolha
    opcoes:
      - { valor: arenosa,  pt: "Mais arenosa",          en: "Sandy" }
      - { valor: media,    pt: "Meio-termo",            en: "In between (loam)" }
      - { valor: argilosa, pt: "Mais argilosa (barro)", en: "Clay" }
      - { valor: nao_sei,  pt: "Não sei",               en: "Not sure" }
    obrigatoria: false
    alimenta:
      atributo: textura
      fonte: produtor
      cruza_com: soilgrids
      se_nao_sei: sugerir_teste_do_tato

  - id: q14_encharca
    bloco: 4
    texto:
      pt: "Depois de uma chuva forte, a água fica empoçada por mais de um dia?"
      en: "After a heavy rain, does water sit on the field for more than a day?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: drenagem
      fonte: produtor
      se_sim: ruim
      se_nao: boa
      se_nao_sei: sugerir_observar_depois_da_chuva

  - id: q15_casca
    bloco: 4
    texto:
      pt: "Quando a terra seca, forma uma casca dura por cima?"
      en: "When the soil dries out, does it form a hard crust on top?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: encrostamento
      fonte: produtor

  - id: q16_erosao
    bloco: 4
    texto:
      pt: "Já viu a chuva levar terra embora (valetas, água barrenta saindo do campo)?"
      en: "Have you seen the rain wash soil away — gullies, or muddy water running off the field?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: erosao_observada
      fonte: produtor

  - id: q17_dura
    bloco: 4
    texto:
      pt: "A terra fica dura demais para cavar ou arar?"
      en: "Is the soil too hard to dig or plow?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: compactacao
      fonte: produtor

  - id: q18_minhocas
    bloco: 4
    texto:
      pt: "Quando você cava, encontra minhocas?"
      en: "When you dig, do you find earthworms?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: vida_no_solo
      fonte: produtor
      se_nao_sei: sugerir_buraco_de_um_palmo

  - id: q19_cor
    bloco: 4
    texto:
      pt: "Com qual destas cores a sua terra mais se parece?"
      en: "Which of these colors looks most like your soil?"
    tipo: figuras
    # imagem: fotos de data/onboarding/fotos-solo/ (ainda em revisão; até lá o app mostra amostras de cor)
    opcoes:
      - { valor: escura,   imagem: cor_escura.jpg,    pt: "Preta ou marrom bem escura", en: "Black or very dark brown" }
      - { valor: marrom,   imagem: cor_marrom.jpg,    pt: "Marrom",                     en: "Brown" }
      - { valor: vermelha, imagem: cor_vermelha.jpg,  pt: "Vermelha",                   en: "Red" }
      - { valor: amarela,  imagem: cor_amarela.jpg,   pt: "Amarelada",                  en: "Yellowish" }
      - { valor: cinza,    imagem: cor_cinza.jpg,     pt: "Cinza ou com manchas cinza", en: "Gray, or gray-mottled" }
      - { valor: clara,    imagem: cor_clara.jpg,     pt: "Clara ou esbranquiçada",     en: "Pale or whitish" }
      - { valor: nao_sei,  pt: "Não sei",             en: "Not sure" }
    obrigatoria: false
    alimenta:
      cruza_com: q19_jeito        # a leitura sai do cruzamento cor × jeito (tabela em q19_jeito)
      fonte: produtor
      leitura_sozinha:            # quando só a cor foi respondida (confiança baixa)
        escura: "mais matéria orgânica"
        marrom: "matéria orgânica média"
        vermelha: "geralmente bem drenada"
        amarela: "drenagem um pouco menor"
        cinza: "fica encharcada com frequência"
        clara: "pouca matéria orgânica; pode ser arenosa"

  - id: q19_jeito
    bloco: 4
    texto:
      pt: "E quando você pega um punhado na mão, ela fica mais como qual destas?"
      en: "And when you pick up a handful, which does it feel most like?"
    tipo: figuras
    opcoes:
      - { valor: solta,   imagem: jeito_solta.jpg,     pt: "Solta, escorre entre os dedos",     en: "Loose — runs through your fingers" }
      - { valor: fofa,    imagem: jeito_fofa.jpg,      pt: "Fofa, em grumos pequenos",          en: "Crumbly, in small lumps" }
      - { valor: gruda,   imagem: jeito_gruda.jpg,     pt: "Gruda e dá para moldar molhada",    en: "Sticky — you can mold it when wet" }
      - { valor: torroes, imagem: jeito_torroes.jpg,   pt: "Torrões duros que não se desfazem", en: "Hard clods that won't break up" }
      - { valor: racha,   imagem: jeito_racha.jpg,     pt: "Racha quando seca",                 en: "Cracks open when dry" }
      - { valor: pedras,  imagem: jeito_pedras.jpg,    pt: "Muita pedra ou cascalho",           en: "Lots of stones or gravel" }
      - { valor: nao_sei, pt: "Não sei",               en: "Not sure" }
    obrigatoria: false
    alimenta:
      cruza_com: q19_cor
      fonte: produtor            # cor e jeito são indícios, não análise
      se_nao_sei: sugerir_pegar_um_punhado
      leitura_sozinha:
        solta: "arenosa; retém pouca água"
        fofa: "boa estrutura e vida no solo"
        gruda: "argilosa"
        torroes: "compactada ou adensada"
        racha: "argila expansiva"
        pedras: "pedregosa; raiz e máquina têm limite"
      # Cruzamento cor × jeito (faixas preliminares, [verificar com referência de pedologia]).
      # Combinação fora da tabela: junta as duas leituras sozinhas, com confiança baixa.
      cruzamento:
        - { cor: escura,   jeito: fofa,  leitura: "Matéria orgânica boa, estrutura boa",                                        confianca: media }
        - { cor: vermelha, jeito: gruda, leitura: "Argilosa e bem drenada",                                                     confianca: media }
        - { cor: cinza,    jeito: gruda, leitura: "Argilosa com drenagem ruim; cuidado com culturas sensíveis a encharcamento", confianca: media }
        - { cor: clara,    jeito: solta, leitura: "Arenosa, pouca matéria orgânica, seca rápido",                               confianca: media }
        - { cor: escura,   jeito: solta, leitura: "Combinação incomum; vale confirmar com o teste do tato",                     confianca: baixa }

  - id: q20_partes_piores
    bloco: 4
    texto:
      pt: "Tem partes da área onde a lavoura sempre vai pior?"
      en: "Are there patches where the crop always does worse?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: variacao_no_campo
      fonte: produtor

  # Antes: q21_calcario ("Já usou calcário?"), que só servia para solo ácido tropical.
  # Agora cobre também solo salino/sódico, comum em regiões secas e irrigadas.
  - id: q21_correcao
    bloco: 4
    texto:
      pt: "Você já fez alguma correção na terra?"
      en: "Have you ever treated your soil to correct it?"
    ajuda:
      pt: "Pode marcar mais de uma."
      en: "You can pick more than one."
    tipo: multipla
    exclusivas: [nao, nao_sei]   # marcar uma destas desmarca as outras
    opcoes:
      - valor: calcario
        pt: "Calcário (para terra ácida)"
        en: "Lime (for acid soil)"
      - valor: gesso
        pt: "Gesso agrícola (para terra com sal)"
        en: "Gypsum (for salty soil)"
      - valor: outra
        pt: "Outra correção"
        en: "Something else"
      - { valor: nao,     pt: "Não",     en: "No" }
      - { valor: nao_sei, pt: "Não sei", en: "Not sure" }
    # Contexto local: em zona árida ou semiárida (zona_climatica começa com B) ou com irrigação,
    # o gesso aparece primeiro; nos outros lugares, o calcário aparece primeiro.
    ordem_por_local:
      gesso_primeiro_se: { zona_climatica_comeca_com: B, ou_q6_irrigacao: [sim, parte] }
    obrigatoria: false
    alimenta:
      fonte: produtor
      se_calcario: { atributo: correcao_acidez, valor: feita }
      se_gesso:    { atributo: correcao_salinidade, valor: feita }

  - id: q22_adubo
    bloco: 4
    texto:
      pt: "Você usa adubo ou esterco?"
      en: "Do you use fertilizer or manure?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: adubacao         # manejo de fertilidade
      fonte: produtor

  # ───────────── Bloco 5: O que você tem sentido no clima ─────────────

  - id: q23_chuva_mudou
    bloco: 5
    texto:
      pt: "Você sente que a chuva mudou nos últimos anos?"
      en: "Do you feel the rains have changed over the last few years?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      atributo: percepcao_mudanca_chuva
      cruza_com: tendencia_chuva_power

  # Perdas de colheita. Cada "sim" abre a pergunta do ano (texto igual para todas, abaixo).
  # Contexto local: geada e sal no solo só aparecem onde fazem sentido (regras em cada uma).

  - id: q24_perdas.geada.resposta
    bloco: 5
    # Não aparece em clima quente sem inverno frio (tropical e árido quente).
    mostrar_se: { zona_climatica_nao_e: [Af, Am, Aw, As, BWh, BSh] }
    texto:
      pt: "Já perdeu a colheita por geada?"
      en: "Have you ever lost a crop to frost?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      tabela: historico_perdas
      evento: geada
      cruza_com: temperatura_minima_power

  - id: q24_perdas.chuva_forte.resposta
    bloco: 5
    texto:
      pt: "Já perdeu a colheita por chuva forte ou temporal?"
      en: "Have you ever lost a crop to heavy rain or storms?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      tabela: historico_perdas
      evento: chuva_forte
      cruza_com: [chuva_extrema_power, chuva_extrema_imerg]

  - id: q24_perdas.alagamento.resposta   # NOVA
    bloco: 5
    texto:
      pt: "Já perdeu a colheita porque a área alagou ou ficou encharcada?"
      en: "Have you ever lost a crop to flooding or waterlogging?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      tabela: historico_perdas
      evento: alagamento
      cruza_com: [chuva_extrema_imerg, umidade_superficie_smap_l4]

  - id: q24_perdas.granizo.resposta      # NOVA
    bloco: 5
    texto:
      pt: "Já perdeu a colheita por chuva de granizo (pedra)?"
      en: "Have you ever lost a crop to hail?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      tabela: historico_perdas
      evento: granizo
      cruza_com: nenhum          # não há dado NASA de granizo nessa escala: fica só o relato do produtor

  - id: q24_perdas.calor.resposta
    bloco: 5
    texto:
      pt: "Já perdeu a colheita por calor forte?"
      en: "Have you ever lost a crop to extreme heat?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      tabela: historico_perdas
      evento: calor
      cruza_com: [temperatura_maxima_power, dias_de_calor_power]

  - id: q24_perdas.seca.resposta
    bloco: 5
    texto:
      pt: "Já perdeu a colheita por seca ou falta de chuva?"
      en: "Have you ever lost a crop to drought?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      tabela: historico_perdas
      evento: seca
      cruza_com: [deficit_hidrico_power, umidade_raizes_smap_l4]

  - id: q24_perdas.salinidade.resposta   # NOVA
    bloco: 5
    # Só aparece onde sal no solo é comum: clima árido ou semiárido, ou campo irrigado.
    mostrar_se: { zona_climatica_comeca_com: B, ou_q6_irrigacao: [sim, parte] }
    texto:
      pt: "Já perdeu a colheita porque a terra ficou salgada (manchas brancas, planta queimando)?"
      en: "Have you ever lost a crop because the soil turned salty (white crust, scorched plants)?"
    tipo: sim_nao_nao_sei
    obrigatoria: false
    alimenta:
      tabela: historico_perdas
      evento: salinidade
      cruza_com: nenhum          # sem dado NASA direto; sugerir análise de condutividade elétrica do solo
      se_sim: sugerir_analise_salinidade

  # Pergunta do ano: aparece depois de cada "sim" acima (geada, chuva_forte, alagamento, granizo,
  # calor, seca, salinidade) e grava em q24_perdas.<evento>.ano.
  - id: q24_perdas.<evento>.ano
    bloco: 5
    mostrar_se: { pergunta: "q24_perdas.<evento>.resposta", valor: sim }
    texto:
      pt: "Lembra mais ou menos o ano?"
      en: "Roughly what year was it?"
    tipo: ano                    # desde 1980 ou "não lembro"
    obrigatoria: false

  # ───────────── Bloco 6: O que é importante pra você ─────────────

  - id: q25_prioridades
    bloco: 6
    texto:
      pt: "O que é mais importante para você? Escolha até 3."
      en: "What matters most to you? Pick up to 3."
    tipo: multipla
    max_escolhas: 3
    opcoes:
      - { valor: agua,    pt: "Economizar água",       en: "Save water" }
      - { valor: terra,   pt: "Melhorar a terra",      en: "Build up the soil" }
      - { valor: erosao,  pt: "Evitar erosão",         en: "Stop erosion" }
      - { valor: renda,   pt: "Ganhar uma renda extra", en: "Extra income" }
      - { valor: animais, pt: "Comida para os animais", en: "Feed for my animals" }
      - { valor: pragas,  pt: "Menos praga",           en: "Fewer pests" }
    obrigatoria: false
    alimenta:
      atributo: pesos_prioridades   # 1ª = 0,5; 2ª = 0,3; 3ª = 0,2 (MOTOR-DE-ANALISE.md)

  # ⚠️ EM ESPERA (q26a): revisar quando a Pessoa 1 terminar a base de culturas.
  - id: q26a_texto
    bloco: 6
    texto:
      pt: "Tem alguma cultura que você não plantaria? Por quê?"
      en: "Is there any crop you would not grow? Why?"
    exemplo:
      pt: "não planto soja, não tenho onde vender"
      en: "I don't grow soy, I have nowhere to sell it"
    tipo: texto_livre
    obrigatoria: false
    interpretacao:
      ia: true                    # casa com culturas.csv + cultura_sinonimos.csv
      catalogo: cultura
      saida: q26a_excluidas       # lista de CulturaExcluida
      campos: [texto_original, cultura_id, motivo]
      motivos:
        - { valor: mercado,    pt: "Mercado",       en: "Market" }
        - { valor: costume,    pt: "Costume",       en: "Habit" }
        - { valor: deu_errado, pt: "Já deu errado", en: "It failed before" }
        - { valor: outro,      pt: "Outro",         en: "Other" }
      confirmar_item_a_item: true
      nao_encontrada: guardar_texto_como_lacuna
      fallback_sem_ia: lista_da_base
    alimenta:
      tabela: restricao
      tipo_restricao: cultura_excluida

  - id: q26b_texto
    bloco: 6
    texto:
      pt: "Que máquinas e ferramentas você tem ou consegue usar?"
      en: "What machinery or equipment do you have or can get access to?"
    exemplo:
      pt: "tenho um trator pequeno e uma plantadeira; a colheita é na mão"
      en: "I have a small tractor and a planter; we harvest by hand"
    tipo: texto_livre
    obrigatoria: false
    interpretacao:
      ia: true                    # casa com equipamentos.csv
      catalogo: equipamento
      saida: q26b_equipamentos    # lista de Equipamento
      campos: [texto_original, equipamento_id]
      confirmar_item_a_item: true
      nao_encontrada: guardar_texto_como_lacuna
      fallback_sem_ia: lista_da_base
    alimenta:
      tabela: restricao
      tipo_restricao: equipamento
